# ┌─────────────────────────────────────────────┐
# │              Local Services                  │
# │                                              │
# │  PostgreSQL  → localhost:5432                │
# │  SQS API     → http://localhost:4566         │
# │  DB UI       → http://localhost:8080
# │  Telemetry Dashboard   → http://localhost:4000/dev/dashboard      │
# │                                              │
# │  Adminer login:                              │
# │    System:   PostgreSQL                      │
# │    Server:   host.docker.internal            │
# │    User:     postgres                        │
# │    Password: postgres                        │
# │    Database: global_payroll_dev              │
# │                                              │
# │  SQS queues:                                 │
# │    payroll-jobs                              │
# │    payment-results                           │
# └─────────────────────────────────────────────┘
#
# Start: docker compose up -d
# Run:   cd global_payroll && mix phx.server

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: global_payroll_dev
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_MAX_CONNECTIONS: 200
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sqs:
    image: floci/floci:latest
    ports:
      - "4566:4566"

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
